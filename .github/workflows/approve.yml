name: Publish approved submission

# One click publishes: add the `approved` label to a submission issue and this
# validates it, appends the row to data/timeline.csv and commits. The commit
# triggers deploy.yml, which rebuilds the site.
#
# The label IS the approval — there is nothing else to do, and no file to edit
# by hand. Anyone who can label issues in this repo can publish, so keep write
# access to the people you intend.

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

concurrency:
  # Serialised: two approvals landing at once would race on the same CSV.
  group: publish-submission
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Write the issue body to a file
        env:
          # Via env, never interpolated into the shell — an issue body is
          # untrusted input and `${{ }}` inside a run block would execute it.
          BODY: ${{ github.event.issue.body }}
        run: printf '%s' "$BODY" > /tmp/submission.md

      - name: Validate and append
        id: apply
        run: node scripts/apply-submission.mjs --body-file /tmp/submission.md

      - name: Rebuild to prove the data still parses
        run: |
          npm ci
          npm run build

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/timeline.csv
          git commit -m "Add timeline entry from #${{ github.event.issue.number }}

          ${{ steps.apply.outputs.summary }}"
          git push

      - name: Comment and close
        uses: actions/github-script@v7
        with:
          script: |
            const summary = ${{ toJSON(steps.apply.outputs.summary) }};
            const newTrack = ${{ toJSON(steps.apply.outputs.new_track) }} === 'true';
            let body = `Published. It will appear on the timeline once the deploy finishes.\n\n\`${summary}\``;
            if (newTrack) {
              body += `\n\nThis created a **new track**. It has been given the next free ` +
                      `shape in its group. To pin its colour or shape, edit \`data/categories.csv\`.`;
            }
            await github.rest.issues.createComment({
              ...context.repo, issue_number: context.issue.number, body,
            });
            await github.rest.issues.addLabels({
              ...context.repo, issue_number: context.issue.number, labels: ['published'],
            });
            await github.rest.issues.update({
              ...context.repo, issue_number: context.issue.number, state: 'closed',
            });

      # Anything that failed above was a validation problem: say what, on the
      # issue, and take the label back off so it can be fixed and re-approved.
      - name: Report a failure back to the issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `Could not publish this entry — it did not pass validation.\n\n` +
                    `[See the run log](${run}) for the reason. Fix the details above and ` +
                    `add the \`approved\` label again.`,
            });
            try {
              await github.rest.issues.removeLabel({
                ...context.repo, issue_number: context.issue.number, name: 'approved',
              });
            } catch (e) { /* already removed */ }
