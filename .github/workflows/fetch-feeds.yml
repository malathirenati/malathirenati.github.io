name: Sync feeds

# Pulls new posts from Medium and the two Substacks into data/articles.csv.
# Weekly is enough: these publish monthly at most, and a missed week costs
# nothing because the next run picks up everything since.
on:
  schedule:
    - cron: "17 4 * * 1"   # Mondays, 04:17 UTC — off the hour, when runners are less contended
  workflow_dispatch:        # "Run workflow" in the Actions tab, for when you publish something today

permissions:
  contents: write           # only to commit data/articles.csv

concurrency:
  group: sync-feeds
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read the feeds
        run: node scripts/fetch-feeds.mjs

      - name: Check the result still builds
        # If a feed ever produced a row the parser rejects, this fails here
        # rather than breaking the deploy after the commit has landed.
        run: |
          npm ci
          npm run data

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- data/articles.csv; then
            echo "No change."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.csv
          git commit -m "Sync new posts from the feeds"
          git push
