<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>MNR Sports News — Daily Brief</title>
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    color-scheme: light;
    --paper:#f2f4f0;
    --paper-raised:#ffffff;
    --ink:#12181d;
    --ink-soft:#4b555e;
    --line:#d9dcd3;
    --accent:#004aad;
    --accent-ink:#00397f;
    --gov:#2a4874;
    --gov-bg:#e4e9f3;
    --mkt:#1c7a52;
    --mkt-bg:#e0f0e6;
    --soc:#b8463f;
    --soc-bg:#f7e3e0;
    --gold:#a9820a;
    --gold-bg:#faf1d6;
    --shadow: 0 1px 2px rgba(18,24,29,0.06), 0 10px 24px -16px rgba(18,24,29,0.28);
    --focus: #004aad;
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --paper:#0f1418;
    --paper-raised:#171d22;
    --ink:#edf0ea;
    --ink-soft:#aab2ab;
    --line:#2a3138;
    --accent:#6fa3ec;
    --accent-ink:#8fb8f2;
    --gov:#93add9;
    --gov-bg:#1e293c;
    --mkt:#7ecfa4;
    --mkt-bg:#152c1f;
    --soc:#ec9993;
    --soc-bg:#3a2320;
    --gold:#e6c250;
    --gold-bg:#3a3013;
    --shadow: 0 1px 2px rgba(0,0,0,0.5), 0 12px 28px -16px rgba(0,0,0,0.7);
    --focus: #6fa3ec;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]):not([data-theme="dark"]){
      color-scheme: dark;
      --paper:#0f1418;
      --paper-raised:#171d22;
      --ink:#edf0ea;
      --ink-soft:#aab2ab;
      --line:#2a3138;
      --accent:#6fa3ec;
      --accent-ink:#8fb8f2;
      --gov:#93add9;
      --gov-bg:#1e293c;
      --mkt:#7ecfa4;
      --mkt-bg:#152c1f;
      --soc:#ec9993;
      --soc-bg:#3a2320;
      --gold:#e6c250;
      --gold-bg:#3a3013;
      --shadow: 0 1px 2px rgba(0,0,0,0.5), 0 12px 28px -16px rgba(0,0,0,0.7);
      --focus: #6fa3ec;
    }
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Source Serif 4", Georgia, "Times New Roman", serif;
    line-height:1.5;
  }
  a{ color:var(--accent-ink); text-decoration-thickness:1px; text-underline-offset:2px; }
  a:hover{ color:var(--accent); }
  a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible{
    outline:2px solid var(--focus); outline-offset:2px;
  }
  button{ font:inherit; cursor:pointer; }
  img{ max-width:100%; display:block; }

  .wrap{ max-width:1180px; margin:0 auto; padding:0 clamp(1rem,3vw,2rem) 4rem; }

  /* ============ TOP BAR ============ */
  .topbar{
    position:sticky; top:0; z-index:20;
    background:var(--paper);
    border-bottom:1px solid var(--line);
    backdrop-filter: blur(6px);
  }
  .brand-row{
    display:flex; align-items:center; justify-content:space-between;
    gap:1rem; padding:0.9rem clamp(1rem,3vw,2rem) 0.6rem;
    max-width:1180px; margin:0 auto;
  }
  .brand{ display:flex; align-items:center; gap:0.75rem; min-width:0; }
  .brand img{ height:40px; width:auto; flex:none; }
  .brand-text{ display:flex; flex-direction:column; line-height:1.05; }
  .brand-text .kicker{
    font-family:"IBM Plex Mono", monospace;
    font-size:0.66rem; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--ink-soft);
  }
  .brand-text .sub{
    font-family:"Barlow Condensed", sans-serif; font-weight:700;
    font-size:1.15rem; letter-spacing:0.01em; text-transform:uppercase;
    color:var(--ink);
  }
  .top-actions{ display:flex; align-items:center; gap:0.5rem; flex:none; }
  .icon-btn{
    background:var(--paper-raised); border:1px solid var(--line); color:var(--ink-soft);
    border-radius:8px; width:34px; height:34px; display:flex; align-items:center; justify-content:center;
    font-size:0.95rem;
  }
  .icon-btn:hover{ color:var(--ink); border-color:var(--ink-soft); }
  /* Same chrome as .icon-btn, but labelled — the way back to the public site. */
  .home-link{
    background:var(--paper-raised); border:1px solid var(--line); color:var(--ink-soft);
    border-radius:8px; height:34px; display:flex; align-items:center; padding:0 0.7rem;
    font-family:"IBM Plex Mono", monospace;
    font-size:0.66rem; letter-spacing:0.12em; text-transform:uppercase;
    text-decoration:none; white-space:nowrap;
  }
  .home-link:hover{ color:var(--ink); border-color:var(--ink-soft); }

  .toolbar{
    display:flex; flex-wrap:wrap; align-items:center; gap:0.6rem 0.8rem;
    padding:0 clamp(1rem,3vw,2rem) 0.85rem;
    max-width:1180px; margin:0 auto;
  }
  .search-field{
    position:relative; flex:1 1 220px; min-width:200px; max-width:360px;
  }
  .search-field input{
    width:100%; padding:0.45rem 0.7rem 0.45rem 2rem;
    border:1px solid var(--line); border-radius:8px;
    background:var(--paper-raised); color:var(--ink);
    font-family:"Source Serif 4", serif; font-size:0.92rem;
  }
  .search-field .ico{
    position:absolute; left:0.6rem; top:50%; transform:translateY(-50%);
    color:var(--ink-soft); font-size:0.85rem; pointer-events:none;
  }
  .search-field .clear{
    position:absolute; right:0.4rem; top:50%; transform:translateY(-50%);
    background:none; border:none; color:var(--ink-soft); font-size:0.9rem; padding:0.2rem 0.4rem;
    display:none;
  }
  .search-field.has-text .clear{ display:block; }

  .datebar{ display:flex; align-items:center; gap:0.35rem; flex-wrap:wrap; }
  .datebar select{
    font-family:"IBM Plex Mono", monospace; font-size:0.74rem; letter-spacing:0.03em;
    padding:0.35rem 0.5rem; border-radius:7px; border:1px solid var(--line);
    background:var(--paper-raised); color:var(--ink);
  }
  .step-btn{
    background:var(--paper-raised); border:1px solid var(--line); color:var(--ink-soft);
    border-radius:7px; width:30px; height:30px; font-size:0.85rem;
  }
  .step-btn:disabled{ opacity:0.35; cursor:default; }
  .step-btn:not(:disabled):hover{ color:var(--ink); border-color:var(--ink-soft); }
  .latest-btn{
    font-family:"IBM Plex Mono", monospace; font-size:0.7rem; font-weight:600;
    letter-spacing:0.06em; text-transform:uppercase;
    background:var(--paper-raised); border:1px solid var(--line); color:var(--accent-ink);
    border-radius:7px; padding:0.4rem 0.65rem;
  }
  .latest-btn:hover{ border-color:var(--accent-ink); }

  .view-tabs{
    display:flex; gap:0.3rem; padding:0 clamp(1rem,3vw,2rem) 0.85rem;
    max-width:1180px; margin:0 auto; flex-wrap:wrap;
  }
  .view-tab{
    font-family:"Barlow Condensed", sans-serif; font-weight:700; font-size:0.95rem;
    letter-spacing:0.02em; text-transform:uppercase;
    background:none; border:1px solid transparent; color:var(--ink-soft);
    padding:0.35rem 0.8rem; border-radius:999px;
  }
  .view-tab.active{ background:var(--accent); color:#fff; }
  .view-tab:not(.active):hover{ color:var(--ink); background:var(--paper-raised); }

  .filter-row{
    display:flex; flex-wrap:wrap; gap:0.5rem 1.4rem; align-items:center;
    padding:0 clamp(1rem,3vw,2rem) 0.9rem;
    max-width:1180px; margin:0 auto;
  }
  .chip-group{ display:flex; align-items:center; gap:0.35rem; flex-wrap:wrap; }
  .chip-group .glabel{
    font-family:"IBM Plex Mono", monospace; font-size:0.66rem; letter-spacing:0.1em;
    text-transform:uppercase; color:var(--ink-soft); margin-right:0.15rem;
  }
  .chip{
    font-family:"IBM Plex Mono", monospace; font-size:0.72rem; font-weight:600;
    letter-spacing:0.03em; text-transform:uppercase;
    background:var(--paper-raised); border:1px solid var(--line); color:var(--ink-soft);
    padding:0.28rem 0.6rem; border-radius:999px;
  }
  .chip.on{ border-color:currentColor; }
  .chip[data-lens="government"].on{ color:var(--gov); background:var(--gov-bg); }
  .chip[data-lens="markets"].on{ color:var(--mkt); background:var(--mkt-bg); }
  .chip[data-lens="society"].on{ color:var(--soc); background:var(--soc-bg); }
  .chip[data-region].on{ color:var(--accent-ink); background:var(--gov-bg); }
  .chip[data-lens="all"].on, .chip[data-region="all"].on{ color:var(--ink); background:var(--line); }

  /* ============ MAIN ============ */
  main{ padding-top:1.6rem; }
  .edition-label{
    font-family:"IBM Plex Mono", monospace; font-size:0.76rem; letter-spacing:0.05em;
    color:var(--ink-soft); text-transform:uppercase; margin-bottom:1.1rem;
  }
  .edition-label strong{ color:var(--ink); }

  .regions{
    display:grid; grid-template-columns:1fr 1fr; gap:clamp(1.25rem,3vw,2.5rem);
    align-items:start;
  }
  .regions.single{ grid-template-columns:1fr; max-width:720px; }
  @media (max-width:820px){ .regions{ grid-template-columns:1fr; } }

  .region-head{
    display:flex; align-items:center; justify-content:space-between; gap:0.6rem;
    margin-bottom:1rem; padding-bottom:0.4rem; border-bottom:1px solid var(--line);
  }
  .region-head h2{
    margin:0; font-family:"Barlow Condensed", sans-serif; font-weight:700;
    text-transform:uppercase; letter-spacing:0.03em; font-size:1.4rem;
  }
  .region-flag{
    font-family:"IBM Plex Mono", monospace; font-size:0.64rem; letter-spacing:0.08em;
    text-transform:uppercase; color:var(--paper-raised); background:var(--ink);
    padding:0.14rem 0.45rem; border-radius:3px;
  }

  .lens{ margin-bottom:1.5rem; }
  .lens:last-child{ margin-bottom:0; }
  .lens-head{ display:flex; align-items:center; justify-content:space-between; gap:0.5rem; margin-bottom:0.65rem; }
  .lens-label{
    display:inline-flex; align-items:center; gap:0.4rem;
    font-family:"IBM Plex Mono", monospace; font-size:0.7rem; font-weight:600;
    letter-spacing:0.08em; text-transform:uppercase;
    padding:0.18rem 0.55rem; border-radius:999px;
  }
  .lens-label.government{ color:var(--gov); background:var(--gov-bg); }
  .lens-label.markets{ color:var(--mkt); background:var(--mkt-bg); }
  .lens-label.society{ color:var(--soc); background:var(--soc-bg); }
  .mail-btn{
    background:none; border:1px solid var(--line); color:var(--ink-soft);
    border-radius:7px; width:26px; height:26px; font-size:0.78rem; flex:none;
  }
  .mail-btn:hover{ color:var(--accent-ink); border-color:var(--accent-ink); }

  .items{ display:flex; flex-direction:column; gap:0.9rem; }
  .item{ padding-left:0.85rem; border-left:2px solid var(--line); }
  .item h3{
    font-family:"Barlow Condensed", sans-serif; font-weight:600; font-size:1.06rem;
    line-height:1.25; margin:0 0 0.2rem; text-wrap:balance;
  }
  .item p{ font-size:0.93rem; color:var(--ink-soft); margin:0 0 0.3rem; }
  .item .src{ font-family:"IBM Plex Mono", monospace; font-size:0.68rem; color:var(--ink-soft); }
  .item .src a{ color:var(--accent-ink); }
  .item .src .sep{ margin:0 0.3rem; color:var(--line); }

  .empty-state{
    font-family:"IBM Plex Mono", monospace; font-size:0.85rem; color:var(--ink-soft);
    padding:2rem 0;
  }

  /* ============ OPPORTUNITIES ============ */
  .opp-grid{
    display:grid; grid-template-columns:repeat(3,1fr); gap:1rem;
  }
  @media (max-width:900px){ .opp-grid{ grid-template-columns:1fr 1fr; } }
  @media (max-width:620px){ .opp-grid{ grid-template-columns:1fr; } }
  .opp-card{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:10px;
    padding:1.05rem 1.1rem 1.15rem; box-shadow:var(--shadow);
    display:flex; flex-direction:column; gap:0.5rem;
  }
  .opp-format{
    align-self:flex-start; font-family:"IBM Plex Mono", monospace; font-size:0.64rem;
    font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--accent-ink);
    border:1px solid var(--accent-ink); border-radius:999px; padding:0.12rem 0.5rem;
  }
  .opp-card h3{ font-family:"Barlow Condensed", sans-serif; font-weight:700; font-size:1.08rem; line-height:1.25; margin:0; }
  .opp-card p{ font-size:0.88rem; color:var(--ink-soft); margin:0; }

  /* ============ SEARCH RESULTS ============ */
  .results-list{ display:flex; flex-direction:column; gap:0.9rem; max-width:820px; }
  .result-card{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:10px;
    padding:0.9rem 1.05rem; box-shadow:var(--shadow);
  }
  .result-meta{
    display:flex; flex-wrap:wrap; gap:0.4rem; align-items:center; margin-bottom:0.4rem;
  }
  .badge{
    font-family:"IBM Plex Mono", monospace; font-size:0.64rem; font-weight:600;
    letter-spacing:0.06em; text-transform:uppercase; padding:0.12rem 0.45rem; border-radius:999px;
    background:var(--line); color:var(--ink-soft);
  }
  .badge.date{ background:none; border:1px solid var(--line); }
  .badge.government{ color:var(--gov); background:var(--gov-bg); }
  .badge.markets{ color:var(--mkt); background:var(--mkt-bg); }
  .badge.society{ color:var(--soc); background:var(--soc-bg); }
  .result-card h3{ font-family:"Barlow Condensed", sans-serif; font-size:1.05rem; margin:0 0 0.25rem; }
  .result-card p{ font-size:0.9rem; color:var(--ink-soft); margin:0 0 0.3rem; }
  .load-more{
    align-self:flex-start; font-family:"IBM Plex Mono", monospace; font-size:0.74rem;
    font-weight:600; letter-spacing:0.04em; text-transform:uppercase;
    background:var(--paper-raised); border:1px solid var(--line); color:var(--accent-ink);
    padding:0.5rem 0.9rem; border-radius:8px; margin-top:0.4rem;
  }
  .load-more:hover{ border-color:var(--accent-ink); }

  footer{
    margin-top:3rem; padding-top:1rem; border-top:1px solid var(--line);
    font-family:"IBM Plex Mono", monospace; font-size:0.7rem; color:var(--ink-soft);
    display:flex; justify-content:space-between; flex-wrap:wrap; gap:0.5rem;
  }

  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
    clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }

  @media (prefers-reduced-motion: no-preference){
    .items, .opp-grid, .results-list{ animation: fade-in 0.25s ease-out; }
  }
  @keyframes fade-in{ from{ opacity:0; transform:translateY(2px);} to{ opacity:1; transform:none;} }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand-row">
    <div class="brand">
      <img src="assets/logo.png" alt="MNR Sports logo" width="120" height="73">
      <div class="brand-text">
        <span class="kicker">Internal · Daily Brief</span>
        <span class="sub">Sports News</span>
      </div>
    </div>
    <div class="top-actions">
      <a class="home-link" href="/" title="Malathi Renati — home">&#8592; Home</a>
      <button class="icon-btn" id="themeToggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">◐</button>
    </div>
  </div>

  <div class="toolbar">
    <div class="search-field" id="searchField">
      <span class="ico">⌕</span>
      <input type="text" id="searchInput" placeholder="Search headlines, sources, keywords…" aria-label="Search briefs">
      <button class="clear" id="searchClear" type="button" aria-label="Clear search">✕</button>
    </div>

    <div class="datebar" id="dateBar">
      <button class="step-btn" id="prevDay" type="button" aria-label="Previous edition">‹</button>
      <select id="yearSelect" aria-label="Year"></select>
      <select id="monthSelect" aria-label="Month"></select>
      <select id="daySelect" aria-label="Day"></select>
      <button class="step-btn" id="nextDay" type="button" aria-label="Next edition">›</button>
      <button class="latest-btn" id="latestBtn" type="button">Latest</button>
    </div>
  </div>

  <div class="view-tabs" role="tablist" aria-label="View">
    <button class="view-tab active" data-view="edition" type="button">Today's Edition</button>
    <button class="view-tab" data-view="opportunities" type="button">Content Opportunities</button>
  </div>

  <div class="filter-row" id="filterRow">
    <div class="chip-group" id="regionChips">
      <span class="glabel">Region</span>
      <button class="chip on" data-region="all" type="button">All</button>
      <button class="chip" data-region="india" type="button">India</button>
      <button class="chip" data-region="global" type="button">Global</button>
    </div>
    <div class="chip-group" id="lensChips">
      <span class="glabel">Lens</span>
      <button class="chip on" data-lens="all" type="button">All</button>
      <button class="chip" data-lens="government" type="button">Government</button>
      <button class="chip" data-lens="markets" type="button">Markets</button>
      <button class="chip" data-lens="society" type="button">Society</button>
    </div>
  </div>
</header>

<div class="wrap">
  <main id="main">
    <p class="empty-state">Loading today's brief…</p>
  </main>

  <footer>
    <span id="genStamp">MNR Sports News — internal use</span>
    <span>Not linked from the public site · reachable by direct URL only</span>
  </footer>
</div>

<script>
(function(){
  "use strict";

  var LENSES = ["government","markets","society"];
  var LENS_LABEL = {government:"Government", markets:"Markets", society:"Society"};
  var REGION_LABEL = {india:"India", global:"Global"};
  var MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  var state = {
    dates: [],                 // ascending ISO date strings, from index.json
    currentDate: null,
    view: "edition",           // edition | opportunities
    region: "all",             // all | india | global
    lens: "all",               // all | government | markets | society
    search: "",
    cache: {},                 // date -> edition JSON
    loadedCount: 0,            // how many (most-recent-first) editions are loaded for search
    searchBudget: 12           // dates to fetch per "load more" batch
  };

  var $ = function(sel, ctx){ return (ctx||document).querySelector(sel); };
  var $$ = function(sel, ctx){ return Array.prototype.slice.call((ctx||document).querySelectorAll(sel)); };

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }

  /* ---------- theme ---------- */
  function initTheme(){
    var saved = null;
    try{ saved = localStorage.getItem("mnr-theme"); }catch(e){}
    if(saved === "light" || saved === "dark"){
      document.documentElement.setAttribute("data-theme", saved);
    }
    $("#themeToggle").addEventListener("click", function(){
      var cur = document.documentElement.getAttribute("data-theme");
      var sysDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      var effectiveDark = cur ? cur === "dark" : sysDark;
      var next = effectiveDark ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try{ localStorage.setItem("mnr-theme", next); }catch(e){}
    });
  }

  /* ---------- data loading ---------- */
  function loadIndex(){
    return fetch("data/index.json", {cache:"no-store"}).then(function(r){
      if(!r.ok) throw new Error("index fetch failed");
      return r.json();
    }).then(function(idx){
      state.dates = (idx.dates || []).slice().sort();
      return state.dates;
    });
  }

  function loadEdition(date){
    if(state.cache[date]) return Promise.resolve(state.cache[date]);
    return fetch("data/" + date + ".json", {cache:"no-store"}).then(function(r){
      if(!r.ok) throw new Error("edition fetch failed: " + date);
      return r.json();
    }).then(function(data){
      state.cache[date] = data;
      state.loadedCount = Object.keys(state.cache).length;
      return data;
    });
  }

  /* ---------- URL sync ---------- */
  function readUrlParams(){
    var p = new URLSearchParams(location.search);
    if(p.get("date")) state.currentDate = p.get("date");
    if(p.get("region")) state.region = p.get("region");
    if(p.get("lens")) state.lens = p.get("lens");
    if(p.get("q")) state.search = p.get("q");
    if(p.get("view")) state.view = p.get("view");
  }
  function syncUrl(){
    var p = new URLSearchParams();
    if(state.view !== "edition") p.set("view", state.view);
    if(state.currentDate) p.set("date", state.currentDate);
    if(state.region !== "all") p.set("region", state.region);
    if(state.lens !== "all") p.set("lens", state.lens);
    if(state.search) p.set("q", state.search);
    var qs = p.toString();
    var url = location.pathname + (qs ? "?" + qs : "");
    history.replaceState(null, "", url);
  }

  /* ---------- date bar ---------- */
  function partsOf(date){ var a = date.split("-"); return {y:a[0], m:a[1], d:a[2]}; }

  function buildDateBar(){
    var years = [], months = {}, days = {};
    state.dates.forEach(function(d){
      var p = partsOf(d);
      if(years.indexOf(p.y) === -1) years.push(p.y);
      months[p.y] = months[p.y] || [];
      if(months[p.y].indexOf(p.m) === -1) months[p.y].push(p.m);
      days[p.y+"-"+p.m] = days[p.y+"-"+p.m] || [];
      if(days[p.y+"-"+p.m].indexOf(p.d) === -1) days[p.y+"-"+p.m].push(p.d);
    });
    state._years = years.sort();
    state._months = months;
    state._days = days;

    var cur = partsOf(state.currentDate);
    var ySel = $("#yearSelect"), mSel = $("#monthSelect"), dSel = $("#daySelect");

    ySel.innerHTML = state._years.map(function(y){
      return '<option value="'+y+'"'+(y===cur.y?" selected":"")+'>'+y+'</option>';
    }).join("");

    var mList = (state._months[cur.y] || []).slice().sort();
    mSel.innerHTML = mList.map(function(m){
      var name = MONTH_NAMES[parseInt(m,10)-1];
      return '<option value="'+m+'"'+(m===cur.m?" selected":"")+'>'+name+'</option>';
    }).join("");

    var dList = (state._days[cur.y+"-"+cur.m] || []).slice().sort();
    dSel.innerHTML = dList.map(function(d){
      return '<option value="'+d+'"'+(d===cur.d?" selected":"")+'>'+d+'</option>';
    }).join("");

    var idx = state.dates.indexOf(state.currentDate);
    $("#prevDay").disabled = idx <= 0;
    $("#nextDay").disabled = idx === -1 || idx >= state.dates.length - 1;
  }

  function goToDate(date){
    if(state.dates.indexOf(date) === -1) return;
    state.currentDate = date;
    state.view = "edition";
    updateViewTabs();
    buildDateBar();
    syncUrl();
    renderEdition();
  }

  function wireDateBar(){
    $("#prevDay").addEventListener("click", function(){
      var idx = state.dates.indexOf(state.currentDate);
      if(idx > 0) goToDate(state.dates[idx-1]);
    });
    $("#nextDay").addEventListener("click", function(){
      var idx = state.dates.indexOf(state.currentDate);
      if(idx !== -1 && idx < state.dates.length-1) goToDate(state.dates[idx+1]);
    });
    $("#latestBtn").addEventListener("click", function(){
      goToDate(state.dates[state.dates.length-1]);
    });
    $("#yearSelect").addEventListener("change", function(){
      var y = this.value;
      var mList = (state._months[y]||[]).slice().sort();
      var m = mList[mList.length-1];
      var dList = (state._days[y+"-"+m]||[]).slice().sort();
      var d = dList[dList.length-1];
      goToDate(y+"-"+m+"-"+d);
    });
    $("#monthSelect").addEventListener("change", function(){
      var y = partsOf(state.currentDate).y;
      var m = this.value;
      var dList = (state._days[y+"-"+m]||[]).slice().sort();
      var d = dList[dList.length-1];
      goToDate(y+"-"+m+"-"+d);
    });
    $("#daySelect").addEventListener("change", function(){
      var y = partsOf(state.currentDate).y;
      var m = $("#monthSelect").value;
      goToDate(y+"-"+m+"-"+this.value);
    });
  }

  /* ---------- filters ---------- */
  function wireChips(){
    $$("#regionChips .chip").forEach(function(btn){
      btn.addEventListener("click", function(){
        state.region = btn.getAttribute("data-region");
        $$("#regionChips .chip").forEach(function(b){ b.classList.toggle("on", b === btn); });
        syncUrl();
        renderCurrentView();
      });
    });
    $$("#lensChips .chip").forEach(function(btn){
      btn.addEventListener("click", function(){
        state.lens = btn.getAttribute("data-lens");
        $$("#lensChips .chip").forEach(function(b){ b.classList.toggle("on", b === btn); });
        syncUrl();
        renderCurrentView();
      });
    });
  }
  function applyFilterUiFromState(){
    $$("#regionChips .chip").forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-region") === state.region); });
    $$("#lensChips .chip").forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-lens") === state.lens); });
  }

  /* ---------- view tabs ---------- */
  function wireViewTabs(){
    $$(".view-tab").forEach(function(tab){
      tab.addEventListener("click", function(){
        state.view = tab.getAttribute("data-view");
        updateViewTabs();
        syncUrl();
        renderCurrentView();
      });
    });
  }
  function updateViewTabs(){
    $$(".view-tab").forEach(function(t){ t.classList.toggle("active", t.getAttribute("data-view") === state.view); });
    $("#filterRow").style.display = state.view === "opportunities" ? "none" : "flex";
    $("#dateBar").style.display = "flex";
  }

  /* ---------- search ---------- */
  function wireSearch(){
    var input = $("#searchInput");
    var field = $("#searchField");
    var timer = null;
    input.addEventListener("input", function(){
      field.classList.toggle("has-text", input.value.length > 0);
      clearTimeout(timer);
      timer = setTimeout(function(){
        state.search = input.value.trim();
        syncUrl();
        renderCurrentView();
      }, 220);
    });
    $("#searchClear").addEventListener("click", function(){
      input.value = "";
      field.classList.remove("has-text");
      state.search = "";
      syncUrl();
      renderCurrentView();
    });
  }

  function matchesQuery(item, q){
    if(!q) return true;
    q = q.toLowerCase();
    var hay = (item.title + " " + item.summary + " " + (item.sources||[]).map(function(s){return s.name;}).join(" ")).toLowerCase();
    return hay.indexOf(q) !== -1;
  }

  /* ---------- mailto ---------- */
  function buildMailto(subject, items, dateLabel){
    var lines = [];
    lines.push(subject + " — " + dateLabel);
    lines.push("");
    items.forEach(function(it){
      lines.push(it.title);
      lines.push(it.summary);
      (it.sources||[]).forEach(function(s){ lines.push("Source: " + s.name + " — " + s.url); });
      lines.push("");
    });
    lines.push("— MNR Sports News (internal daily brief)");
    var body = lines.join("\n");
    if(body.length > 1800) body = body.slice(0, 1780) + "\n…(truncated — open the brief for the rest)";
    return "mailto:?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
  }

  /* ---------- rendering: edition (reading mode) ---------- */
  function itemHtml(it){
    var srcs = (it.sources||[]).map(function(s){
      return '<a href="'+escapeHtml(s.url)+'" target="_blank" rel="noopener">'+escapeHtml(s.name)+'</a>';
    }).join('<span class="sep">·</span>');
    return '<div class="item">'
      + '<h3>'+escapeHtml(it.title)+'</h3>'
      + '<p>'+escapeHtml(it.summary)+'</p>'
      + (srcs ? '<p class="src">'+srcs+'</p>' : '')
      + '</div>';
  }

  function lensBlockHtml(edition, region, lens, dateLabel){
    var items = (edition.regions[region] && edition.regions[region][lens]) || [];
    var filtered = items.filter(function(it){ return matchesQuery(it, state.search); });
    if(!filtered.length) return "";
    var subject = REGION_LABEL[region] + " — " + LENS_LABEL[lens];
    var mailHref = buildMailto(subject, filtered, dateLabel);
    return '<div class="lens" data-lens="'+lens+'">'
      + '<div class="lens-head">'
      +   '<span class="lens-label '+lens+'">'+LENS_LABEL[lens]+'</span>'
      +   '<a class="mail-btn" href="'+mailHref+'" title="Email this section" aria-label="Email this section">✉</a>'
      + '</div>'
      + '<div class="items">' + filtered.map(itemHtml).join("") + '</div>'
      + '</div>';
  }

  function regionBlockHtml(edition, region, dateLabel){
    var lenses = state.lens === "all" ? LENSES : [state.lens];
    var blocks = lenses.map(function(l){ return lensBlockHtml(edition, region, l, dateLabel); }).filter(Boolean);
    if(!blocks.length) return "";
    return '<section class="region" aria-labelledby="'+region+'-head">'
      + '<div class="region-head"><h2 id="'+region+'-head">'+REGION_LABEL[region]+'</h2>'
      + '<span class="region-flag">'+(region==="india"?"IND":"WORLD")+'</span></div>'
      + blocks.join("")
      + '</section>';
  }

  function renderEdition(){
    var main = $("#main");
    main.innerHTML = '<p class="empty-state">Loading…</p>';
    loadEdition(state.currentDate).then(function(edition){
      var regions = state.region === "all" ? ["india","global"] : [state.region];
      var dateLabel = (edition.weekday ? edition.weekday + ", " : "") + state.currentDate;
      var blocks = regions.map(function(r){ return regionBlockHtml(edition, r, dateLabel); }).filter(Boolean);
      var label = '<p class="edition-label"><strong>'+dateLabel+'</strong> edition — India &amp; Global desks, read through Government / Markets / Society</p>';
      if(!blocks.length){
        main.innerHTML = label + '<p class="empty-state">No items match this filter for this date.</p>';
        return;
      }
      main.innerHTML = label + '<div class="regions'+(regions.length===1?' single':'')+'">' + blocks.join("") + '</div>';
    }).catch(function(err){
      main.innerHTML = '<p class="empty-state">Couldn\'t load this edition (' + escapeHtml(err.message) + ').</p>';
    });
  }

  /* ---------- rendering: opportunities ---------- */
  function renderOpportunities(){
    var main = $("#main");
    main.innerHTML = '<p class="empty-state">Loading…</p>';
    loadEdition(state.currentDate).then(function(edition){
      var opps = (edition.opportunities||[]).filter(function(o){ return matchesQuery(o, state.search); });
      var dateLabel = (edition.weekday ? edition.weekday + ", " : "") + state.currentDate;
      var label = '<p class="edition-label"><strong>'+dateLabel+'</strong> — angles not yet well covered elsewhere</p>';
      if(!opps.length){
        main.innerHTML = label + '<p class="empty-state">No content opportunities match this filter for this date.</p>';
        return;
      }
      var cards = opps.map(function(o){
        return '<article class="opp-card">'
          + '<span class="opp-format">'+escapeHtml(o.format)+'</span>'
          + '<h3>'+escapeHtml(o.title)+'</h3>'
          + '<p>'+escapeHtml(o.summary)+'</p>'
          + '</article>';
      }).join("");
      var mailHref = buildMailto("Content Opportunities", opps, dateLabel);
      main.innerHTML = label
        + '<p style="margin:-0.6rem 0 1.1rem;"><a class="mail-btn" style="display:inline-flex;width:auto;height:auto;padding:0.3rem 0.6rem;gap:0.3rem;" href="'+mailHref+'">✉ Email this list</a></p>'
        + '<div class="opp-grid">' + cards + '</div>';
    }).catch(function(err){
      main.innerHTML = '<p class="empty-state">Couldn\'t load this edition (' + escapeHtml(err.message) + ').</p>';
    });
  }

  /* ---------- rendering: search results across dates ---------- */
  function renderSearchResults(){
    var main = $("#main");
    var descDates = state.dates.slice().reverse();
    var toLoad = descDates.slice(state.loadedCount, state.loadedCount + state.searchBudget);
    if(!toLoad.length){ renderSearchResultsFromCache(); return; }
    main.innerHTML = '<p class="empty-state">Searching…</p>';
    Promise.all(toLoad.map(loadEdition)).then(renderSearchResultsFromCache).catch(function(err){
      main.innerHTML = '<p class="empty-state">Search failed (' + escapeHtml(err.message) + ').</p>';
    });
  }

  function renderSearchResultsFromCache(){
    var main = $("#main");
    var descDates = state.dates.slice().reverse();
    var loadedDates = descDates.filter(function(d){ return !!state.cache[d]; });
    var regions = state.region === "all" ? ["india","global"] : [state.region];
    var lenses = state.lens === "all" ? LENSES : [state.lens];
    var results = [];

    loadedDates.forEach(function(date){
      var edition = state.cache[date];
      regions.forEach(function(region){
        lenses.forEach(function(lens){
          var items = (edition.regions[region] && edition.regions[region][lens]) || [];
          items.forEach(function(it){
            if(matchesQuery(it, state.search)){
              results.push({date:date, region:region, lens:lens, item:it});
            }
          });
        });
      });
    });

    var label = '<p class="edition-label">Search results for <strong>&ldquo;'+escapeHtml(state.search)+'&rdquo;</strong> — scanned ' + loadedDates.length + ' of ' + state.dates.length + ' editions</p>';

    if(!results.length){
      var more = loadedDates.length < descDates.length;
      main.innerHTML = label + '<p class="empty-state">No matches yet in the editions scanned.'+(more ? ' Try “search further back.”' : '')+'</p>'
        + (more ? '<button class="load-more" id="loadMoreBtn" type="button">Search further back (' + (descDates.length - loadedDates.length) + ' more days)</button>' : '');
    } else {
      var cards = results.map(function(r){
        return '<div class="result-card">'
          + '<div class="result-meta">'
          +   '<span class="badge date">'+r.date+'</span>'
          +   '<span class="badge">'+REGION_LABEL[r.region]+'</span>'
          +   '<span class="badge '+r.lens+'">'+LENS_LABEL[r.lens]+'</span>'
          + '</div>'
          + '<h3>'+escapeHtml(r.item.title)+'</h3>'
          + '<p>'+escapeHtml(r.item.summary)+'</p>'
          + (r.item.sources && r.item.sources.length ? '<p class="src">' + r.item.sources.map(function(s){
              return '<a href="'+escapeHtml(s.url)+'" target="_blank" rel="noopener">'+escapeHtml(s.name)+'</a>';
            }).join('<span class="sep">·</span>') + '</p>' : '')
          + '</div>';
      }).join("");
      var more = loadedDates.length < descDates.length;
      main.innerHTML = label + '<div class="results-list">' + cards
        + (more ? '<button class="load-more" id="loadMoreBtn" type="button">Search further back (' + (descDates.length - loadedDates.length) + ' more days)</button>' : '')
        + '</div>';
    }

    var btn = $("#loadMoreBtn");
    if(btn) btn.addEventListener("click", renderSearchResults);
  }

  /* ---------- view dispatch ---------- */
  function renderCurrentView(){
    applyFilterUiFromState();
    if(state.search){
      renderSearchResults();
      return;
    }
    if(state.view === "opportunities"){
      renderOpportunities();
    } else {
      renderEdition();
    }
  }

  /* ---------- boot ---------- */
  function boot(){
    initTheme();
    readUrlParams();
    loadIndex().then(function(dates){
      if(!dates.length){
        $("#main").innerHTML = '<p class="empty-state">No editions published yet.</p>';
        return;
      }
      if(!state.currentDate || state.dates.indexOf(state.currentDate) === -1){
        state.currentDate = state.dates[state.dates.length-1];
      }
      $("#genStamp").textContent = "MNR Sports News — internal use — " + state.dates.length + " edition" + (state.dates.length===1?"":"s") + " archived";
      buildDateBar();
      wireDateBar();
      wireChips();
      wireViewTabs();
      wireSearch();
      applyFilterUiFromState();
      updateViewTabs();
      if(state.search){ $("#searchInput").value = state.search; $("#searchField").classList.add("has-text"); }
      renderCurrentView();
    }).catch(function(err){
      $("#main").innerHTML = '<p class="empty-state">Couldn\'t load the brief index (' + escapeHtml(err.message) + '). If you just deployed this page, check that data/index.json is reachable at this path.</p>';
    });
  }

  document.addEventListener("DOMContentLoaded", boot);
})();
</script>
</body>
</html>
